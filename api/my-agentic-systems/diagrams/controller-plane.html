<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controller Plane</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <main class="diagram-page">
    <div class="diagram-sheet">
      <h1 class="diagram-title">Controller Plane</h1>
      <p class="diagram-subtitle">The controller makes work visible while the runtime keeps execution authority.</p>
      <section class="db-diagram"><h2 class="db-diagram__heading">Controller architecture</h2><div class="db-component-stack"><div class="db-component db-component--node-only db-component--compact">
<div class="db-component__node" style="--db-x:50%;--db-y:50%;">Angular Controller UI</div>
</div>
<div class="db-component db-component--node-with-down-arrow db-component--compact">
  <svg class="db-component__connectors" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <line x1="50" y1="60" x2="50" y2="88" />
  </svg>
<span class="db-component__arrowhead" aria-hidden="true" style="--db-x:50%;--db-y:88%;"></span>
<div class="db-component__node" style="--db-x:50%;--db-y:50%;">Nest Controller API</div>
</div>
<div class="db-component db-component--node-only db-component--compact">
<div class="db-component__node" style="--db-x:50%;--db-y:50%;">Controller Plane</div>
</div>
<div class="db-component db-component--tri-node-component db-component--compact">
  <svg class="db-component__connectors" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <line x1="50" y1="0" x2="50" y2="20" />
    <line x1="16" y1="20" x2="84" y2="20" />
    <line x1="16" y1="20" x2="16" y2="39" />
    <line x1="50" y1="20" x2="50" y2="39" />
    <line x1="84" y1="20" x2="84" y2="39" />
    <line x1="16" y1="61" x2="16" y2="76" />
    <line x1="50" y1="61" x2="50" y2="76" />
    <line x1="84" y1="61" x2="84" y2="76" />
    <line x1="16" y1="76" x2="84" y2="76" />
    <line x1="50" y1="76" x2="50" y2="94" />
  </svg>
<span class="db-component__arrowhead" aria-hidden="true" style="--db-x:16%;--db-y:39%;"></span>
<span class="db-component__arrowhead" aria-hidden="true" style="--db-x:50%;--db-y:39%;"></span>
<span class="db-component__arrowhead" aria-hidden="true" style="--db-x:84%;--db-y:39%;"></span>
<span class="db-component__arrowhead" aria-hidden="true" style="--db-x:50%;--db-y:94%;"></span>
<div class="db-component__node" style="--db-x:16%;--db-y:50%;">path map</div>
<div class="db-component__node" style="--db-x:50%;--db-y:50%;">data store</div>
<div class="db-component__node" style="--db-x:84%;--db-y:50%;">change impact</div>
</div>
<div class="db-component db-component--node-only db-component--compact">
<div class="db-component__node" style="--db-x:50%;--db-y:50%;">Agent Runtime</div>
</div>
<div class="db-component db-component--tri-node-without-bottom-line">
  <svg class="db-component__connectors" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <line x1="50" y1="0" x2="50" y2="20" />
    <line x1="16" y1="20" x2="84" y2="20" />
    <line x1="16" y1="20" x2="16" y2="39" />
    <line x1="50" y1="20" x2="50" y2="39" />
    <line x1="84" y1="20" x2="84" y2="39" />
    <line x1="84" y1="60" x2="84" y2="78" />
  </svg>
<span class="db-component__arrowhead" aria-hidden="true" style="--db-x:16%;--db-y:39%;"></span>
<span class="db-component__arrowhead" aria-hidden="true" style="--db-x:50%;--db-y:39%;"></span>
<span class="db-component__arrowhead" aria-hidden="true" style="--db-x:84%;--db-y:39%;"></span>
<span class="db-component__arrowhead" aria-hidden="true" style="--db-x:84%;--db-y:78%;"></span>
<div class="db-component__node" style="--db-x:16%;--db-y:50%;">workflows</div>
<div class="db-component__node" style="--db-x:50%;--db-y:50%;">messages</div>
<div class="db-component__node" style="--db-x:84%;--db-y:50%;">memory and logs</div>
<div class="db-component__caption" style="--db-x:84%;--db-y:91%;">durable state</div></div></div></section>
    </div>
  </main>
