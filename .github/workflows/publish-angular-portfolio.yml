name: Publish notes profile
on:
  push:
    branches: [master]
    paths:
      - 'profile/**'
      - '.github/workflows/publish-angular-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: profile/package-lock.json
      - run: npm ci
        working-directory: profile
      - run: npm test
        working-directory: profile
      - run: npm run build
        working-directory: profile
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: profile/dist/profile/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy notes profile
        id: deployment
        uses: actions/deploy-pages@v4
