name: Publish Angular portfolio
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full verified commit SHA from gopalcb/my-lab-portfolio
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified portfolio source
        uses: actions/checkout@v4
        with:
          repository: gopalcb/my-lab-portfolio
          ref: ${{ inputs.source_ref }}
          path: portfolio
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - run: npm ci
        working-directory: portfolio
      - run: npm test -- --watch=false
        working-directory: portfolio
      - run: npm run build
        working-directory: portfolio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist/my-work-portfolio/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
