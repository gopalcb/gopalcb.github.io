    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3C%2Fsvg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <script>
      // GitHub Pages redirects directory entries to a trailing slash.
      // Normalize the client route before Angular matches it.
      if (location.pathname.length > 1 && location.pathname.endsWith('/')) {
        history.replaceState(null, '', location.pathname.replace(/\/+$/, '') + location.search + location.hash);
      }
    </script>
    <app-root></app-root>
  </body>
</html>
