<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gopal Chandra Bala · Notes & Projects</title>
    <base href="/" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-blank-v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <script>
      // GitHub Pages redirects directory entries to a trailing slash.
      // Normalize the client route before Angular matches it.
      if (location.pathname.length > 1 && location.pathname.endsWith('/')) {
        history.replaceState(null, '', location.pathname.replace(/\/+$/, '') + location.search + location.hash);
      }
    </script>
    <app-root></app-root>
  </body>
</html>
