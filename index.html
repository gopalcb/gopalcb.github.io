<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="refresh"
      content="0; url=https://gopalcb.github.io/my-agentic-systems/articles/why-i-built-my-agent-systems"
    >
    <link rel="canonical" href="https://gopalcb.github.io/my-agentic-systems/articles/why-i-built-my-agent-systems">
    <title>Redirecting to My Agent Systems</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --surface: #ffffff;
        --text: #20242a;
        --text-soft: #59616b;
        --accent: #247b5f;
        --border: #d8dee6;
        --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
        color: var(--text);
        font-family: var(--font);
      }

      main {
        width: min(520px, 100%);
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--surface);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--text-soft);
        font-size: 14px;
        line-height: 1.6;
      }

      a {
        color: var(--accent);
        font-weight: 700;
      }
    </style>
    <script>
      window.location.replace('https://gopalcb.github.io/my-agentic-systems/articles/why-i-built-my-agent-systems');
    </script>
  </head>
  <body>
    <main>
      <h1>Redirecting to My Agent Systems</h1>
      <p>
        Open
        <a href="https://gopalcb.github.io/my-agentic-systems/articles/why-i-built-my-agent-systems">
          My Agent Systems
        </a>
        if the redirect does not start automatically.
      </p>
    </main>
  </body>
</html>
